<svg xmlns="http://www.w3.org/2000/svg" width="340" height="350" viewBox="0 0 340 350">
  <rect x="0" y="0" width="340" height="350" fill="#ffffff"/>
  <!-- circumcircle, centre (170,170), r = 140 -->
  <circle cx="170" cy="170" r="140" fill="#fafafa" stroke="#888888" stroke-width="1.5"/>
  <!-- triangle ABC -->
  <polygon points="145.7,32.1 48.8,240 301.6,217.9" fill="none" stroke="#000000" stroke-width="2"/>
  <!-- altitudes, from each vertex through H to the opposite side -->
  <line x1="145.7" y1="32.1" x2="163.0" y2="230.0" stroke="#777777" stroke-width="1.2" stroke-dasharray="4,3"/>
  <line x1="48.8"  y1="240"  x2="208.0" y2="106.3" stroke="#777777" stroke-width="1.2" stroke-dasharray="4,3"/>
  <line x1="301.6" y1="217.9" x2="102.4" y2="125.0" stroke="#777777" stroke-width="1.2" stroke-dasharray="4,3"/>
  <!-- H to its three reflections -->
  <line x1="156.0" y1="150.0" x2="170.0" y2="310.0" stroke="#cc2222" stroke-width="1.4"/>
  <line x1="156.0" y1="150.0" x2="259.9" y2="62.7"  stroke="#cc2222" stroke-width="1.4"/>
  <line x1="156.0" y1="150.0" x2="48.8"  y2="100.0" stroke="#cc2222" stroke-width="1.4"/>
  <!-- vertices -->
  <circle cx="145.7" cy="32.1"  r="4" fill="#000000"/>
  <circle cx="48.8"  cy="240"   r="4" fill="#000000"/>
  <circle cx="301.6" cy="217.9" r="4" fill="#000000"/>
  <!-- orthocentre -->
  <circle cx="156.0" cy="150.0" r="4.5" fill="#1155cc"/>
  <!-- the three reflections -->
  <circle cx="170.0" cy="310.0" r="4.5" fill="#cc2222"/>
  <circle cx="259.9" cy="62.7"  r="4.5" fill="#cc2222"/>
  <circle cx="48.8"  cy="100.0" r="4.5" fill="#cc2222"/>
  <!-- labels -->
  <text x="140" y="24"  font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#000000" text-anchor="middle">A</text>
  <text x="36"  y="252" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#000000" text-anchor="middle">B</text>
  <text x="315" y="224" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#000000" text-anchor="middle">C</text>
  <text x="147" y="143" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1155cc" text-anchor="end">H</text>
  <text x="180" y="328" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#cc2222" text-anchor="middle">symétrique / (BC)</text>
  <text x="272" y="56"  font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#cc2222" text-anchor="start">/ (CA)</text>
  <text x="40"  y="92"  font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#cc2222" text-anchor="end">/ (AB)</text>
</svg>
