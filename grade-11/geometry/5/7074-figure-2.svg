<svg xmlns="http://www.w3.org/2000/svg" width="320" height="330" viewBox="0 0 320 330">
  <rect x="0" y="0" width="320" height="330" fill="#ffffff"/>
  <circle cx="160" cy="150" r="130" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.2"/>
  <polygon points="160,20 47.4,215 272.6,215" fill="none" stroke="#000000" stroke-width="2"/>
  <!-- line C - P - D -->
  <line x1="272.6" y1="215" x2="31.9" y2="302.6" stroke="#666666" stroke-width="1.4"/>
  <!-- the line through A, Q, P -->
  <line x1="160" y1="20" x2="115.5" y2="272.2" stroke="#1155cc" stroke-width="2"/>
  <!-- equilateral triangle BPD -->
  <polygon points="47.4,215 115.5,272.2 31.9,302.6" fill="#f0e2e2" stroke="#cc2222" stroke-width="1.8"/>
  <circle cx="160"   cy="20"    r="4" fill="#000000"/>
  <circle cx="47.4"  cy="215"   r="4" fill="#000000"/>
  <circle cx="272.6" cy="215"   r="4" fill="#000000"/>
  <circle cx="115.5" cy="272.2" r="4.5" fill="#1155cc"/>
  <circle cx="125.6" cy="215"   r="4.5" fill="#1155cc"/>
  <circle cx="31.9"  cy="302.6" r="4.5" fill="#cc2222"/>
  <text x="160"   y="13"  font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#000000" text-anchor="middle">A</text>
  <text x="36"    y="208" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#000000" text-anchor="end">B</text>
  <text x="285"   y="225" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#000000" text-anchor="middle">C</text>
  <text x="124"   y="288" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1155cc" text-anchor="start">P</text>
  <text x="133"   y="205" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1155cc" text-anchor="start">Q</text>
  <text x="26"    y="320" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#cc2222" text-anchor="middle">D</text>
</svg>
