<svg xmlns="http://www.w3.org/2000/svg" width="340" height="270" viewBox="0 0 340 270">
  <rect x="0" y="0" width="340" height="270" fill="#ffffff"/>
  <!-- outer rectangle 4 x 3, 70 px per unit, origin (30,240) -->
  <rect x="30" y="30" width="280" height="210" fill="#f4f4f4" stroke="#000000" stroke-width="2"/>
  <!-- internal cuts -->
  <polyline points="30,100 100,170 170,100 240,170 310,100" fill="none" stroke="#000000" stroke-width="2"/>
  <line x1="100" y1="170" x2="100" y2="240" stroke="#000000" stroke-width="2"/>
  <line x1="240" y1="170" x2="240" y2="240" stroke="#000000" stroke-width="2"/>
  <line x1="170" y1="30" x2="170" y2="100" stroke="#000000" stroke-width="2"/>
  <!-- marked vertices -->
  <circle cx="30"  cy="30"  r="3.5" fill="#000000"/>
  <circle cx="170" cy="30"  r="3.5" fill="#000000"/>
  <circle cx="310" cy="30"  r="3.5" fill="#000000"/>
  <circle cx="30"  cy="100" r="3.5" fill="#000000"/>
  <circle cx="170" cy="100" r="3.5" fill="#000000"/>
  <circle cx="310" cy="100" r="3.5" fill="#000000"/>
  <circle cx="100" cy="170" r="3.5" fill="#000000"/>
  <circle cx="240" cy="170" r="3.5" fill="#000000"/>
  <circle cx="30"  cy="240" r="3.5" fill="#000000"/>
  <circle cx="100" cy="240" r="3.5" fill="#000000"/>
  <circle cx="240" cy="240" r="3.5" fill="#000000"/>
  <circle cx="310" cy="240" r="3.5" fill="#000000"/>
  <!-- region letters -->
  <text x="95"  y="70"  font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#000000" text-anchor="middle">A</text>
  <text x="245" y="70"  font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#000000" text-anchor="middle">B</text>
  <text x="58"  y="200" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#000000" text-anchor="middle">C</text>
  <text x="170" y="210" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#000000" text-anchor="middle">D</text>
  <text x="285" y="200" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#000000" text-anchor="middle">E</text>
  <!-- dimension labels -->
  <text x="100" y="22"  font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444444" text-anchor="middle">2</text>
  <text x="182" y="70"  font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444444" text-anchor="start">1</text>
  <text x="20"  y="175" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444444" text-anchor="end">2</text>
  <text x="112" y="212" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444444" text-anchor="start">1</text>
  <text x="65"  y="258" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444444" text-anchor="middle">1</text>
</svg>
