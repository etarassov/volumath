<svg xmlns="http://www.w3.org/2000/svg" width="440" height="270" viewBox="0 0 440 270">
  <rect x="0" y="0" width="440" height="270" fill="#ffffff"/>
  <!-- echelle : 1 unite = 40 px ; ligne d a y = 230 ; origine x = 60 -->
  <!-- cercle de rayon 1 : centre (60, 190) -->
  <circle cx="60" cy="190" r="40" fill="#eeeeee" stroke="#000000" stroke-width="2"/>
  <!-- cercle de rayon 4 : centre (60 + 160, 230 - 160) = (220, 70) -->
  <circle cx="220" cy="70" r="160" fill="#eeeeee" stroke="#000000" stroke-width="2"/>
  <!-- petit cercle de rayon 4/9 : centre (60 + 40*4/3, 230 - 40*4/9) = (113.33, 212.22) -->
  <circle cx="113.33" cy="212.22" r="17.78" fill="#b9b9b9" stroke="#000000" stroke-width="2"/>
  <!-- la droite d -->
  <line x1="10" y1="230" x2="430" y2="230" stroke="#000000" stroke-width="2.5"/>
  <text x="404" y="250" font-family="serif" font-size="15" font-style="italic">d</text>
  <!-- centres et rayons -->
  <circle cx="60" cy="190" r="3" fill="#000000"/>
  <circle cx="220" cy="70" r="3" fill="#000000"/>
  <line x1="60" y1="190" x2="60" y2="230" stroke="#555555" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="220" y1="70" x2="220" y2="230" stroke="#555555" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="60" y1="190" x2="220" y2="70" stroke="#555555" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="38" y="176" font-family="serif" font-size="14">1</text>
  <text x="228" y="156" font-family="serif" font-size="14">4</text>
  <text x="96" y="258" font-family="serif" font-size="14">?</text>
  <line x1="113.33" y1="230" x2="113.33" y2="244" stroke="#555555" stroke-width="1.2"/>
</svg>
