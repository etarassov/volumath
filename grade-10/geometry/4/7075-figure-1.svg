<svg xmlns="http://www.w3.org/2000/svg" width="300" height="285" viewBox="0 0 300 285">
  <rect x="0" y="0" width="300" height="285" fill="#ffffff"/>
  <!-- parallelogram A B C D : A(35,240) B(170,240) C(245,45) D(110,45) -->
  <polygon points="35,240 170,240 245,45 110,45" fill="#f6f6f6" stroke="#000000" stroke-width="2"/>
  <!-- line BC extended a little beyond C and B -->
  <line x1="150" y1="292" x2="259" y2="9" stroke="#bbbbbb" stroke-width="1"/>
  <!-- bisector from D through E to M -->
  <line x1="110" y1="45" x2="214.5" y2="197.1" stroke="#cc2222" stroke-width="1.8"/>
  <!-- perpendicular bisector of AD, through N(72.5,142.5) -->
  <line x1="30" y1="112" x2="245" y2="195" stroke="#1155cc" stroke-width="1.5" stroke-dasharray="6,4"/>
  <!-- line A M, with F on BC -->
  <line x1="35" y1="240" x2="214.5" y2="197.1" stroke="#118844" stroke-width="1.8"/>
  <!-- tick marks on AD halves -->
  <circle cx="72.5" cy="142.5" r="3" fill="#1155cc"/>
  <!-- vertices -->
  <circle cx="35"  cy="240" r="4" fill="#000000"/>
  <circle cx="170" cy="240" r="4" fill="#000000"/>
  <circle cx="245" cy="45"  r="4" fill="#000000"/>
  <circle cx="110" cy="45"  r="4" fill="#000000"/>
  <circle cx="196.5" cy="171.0" r="4.5" fill="#cc2222"/>
  <circle cx="214.5" cy="197.1" r="4.5" fill="#cc2222"/>
  <circle cx="183.7" cy="204.5" r="4.5" fill="#118844"/>
  <!-- labels -->
  <text x="26"  y="255" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#000000" text-anchor="middle">A</text>
  <text x="170" y="258" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#000000" text-anchor="middle">B</text>
  <text x="256" y="40"  font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#000000" text-anchor="middle">C</text>
  <text x="100" y="40"  font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#000000" text-anchor="middle">D</text>
  <text x="203" y="162" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#cc2222" text-anchor="start">E</text>
  <text x="224" y="207" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#cc2222" text-anchor="start">M</text>
  <text x="174" y="230" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#118844" text-anchor="end">F</text>
  <text x="62"  y="136" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1155cc" text-anchor="end">N</text>
</svg>
