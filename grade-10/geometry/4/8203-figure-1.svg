<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 370" width="540" height="370" font-family="Helvetica, Arial, sans-serif" font-size="17">
  <!-- shaded regions -->
  <polygon points="60,300 200,300 177.7,261.8" fill="#d8d8d8" stroke="none"/>
  <polygon points="460,60 460,170 368.2,144.8" fill="#d8d8d8" stroke="none"/>
  <polygon points="460,300 200,300 276.1,229.8 460,170" fill="#d8d8d8" stroke="none"/>
  <!-- rectangle -->
  <polygon points="60,60 460,60 460,300 60,300" fill="none" stroke="#000" stroke-width="2"/>
  <!-- the four cevians -->
  <line x1="60"  y1="300" x2="460" y2="170" stroke="#000" stroke-width="1.3"/>
  <line x1="60"  y1="60"  x2="200" y2="300" stroke="#000" stroke-width="1.3"/>
  <line x1="460" y1="60"  x2="200" y2="300" stroke="#000" stroke-width="1.3"/>
  <line x1="60"  y1="60"  x2="460" y2="170" stroke="#000" stroke-width="1.3"/>
  <!-- points -->
  <circle cx="60"    cy="60"    r="3.2" fill="#000"/>
  <circle cx="460"   cy="60"    r="3.2" fill="#000"/>
  <circle cx="460"   cy="300"   r="3.2" fill="#000"/>
  <circle cx="60"    cy="300"   r="3.2" fill="#000"/>
  <circle cx="200"   cy="300"   r="3.2" fill="#000"/>
  <circle cx="460"   cy="170"   r="3.2" fill="#000"/>
  <circle cx="177.7" cy="261.8" r="3.2" fill="#000"/>
  <circle cx="276.1" cy="229.8" r="3.2" fill="#000"/>
  <circle cx="368.2" cy="144.8" r="3.2" fill="#000"/>
  <!-- labels -->
  <text x="44"  y="54"  >D</text>
  <text x="468" y="54"  >C</text>
  <text x="468" y="317" >B</text>
  <text x="44"  y="317" >A</text>
  <text x="196" y="322" >P</text>
  <text x="470" y="176" >Q</text>
  <text x="160" y="252" >X</text>
  <text x="279" y="222" >Y</text>
  <text x="366" y="136" >Z</text>
  <!-- region letters -->
  <text x="116" y="295" font-style="italic">a</text>
  <text x="440" y="132" font-style="italic">b</text>
  <text x="318" y="275" font-style="italic">c</text>
</svg>
