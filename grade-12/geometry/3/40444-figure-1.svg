<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 330" width="400" height="330">
  <rect x="0" y="0" width="400" height="330" fill="#ffffff"/>
  <!-- arêtes cachées -->
  <line x1="80" y1="280" x2="155" y2="230" stroke="#777777" stroke-width="1.2" stroke-dasharray="5,4"/>
  <line x1="155" y1="230" x2="305" y2="230" stroke="#777777" stroke-width="1.2" stroke-dasharray="5,4"/>
  <!-- arêtes visibles -->
  <line x1="80" y1="280" x2="230" y2="280" stroke="#000000" stroke-width="1.2"/>
  <line x1="230" y1="280" x2="230" y2="130" stroke="#000000" stroke-width="1.2"/>
  <line x1="80" y1="280" x2="80" y2="130" stroke="#000000" stroke-width="1.2"/>
  <line x1="305" y1="230" x2="305" y2="80" stroke="#000000" stroke-width="1.2"/>
  <line x1="230" y1="130" x2="305" y2="80" stroke="#000000" stroke-width="1.2"/>
  <line x1="80" y1="130" x2="155" y2="80" stroke="#000000" stroke-width="1.2"/>
  <line x1="155" y1="80" x2="305" y2="80" stroke="#000000" stroke-width="1.2"/>
  <!-- D1 = (EF) -->
  <line x1="12" y1="130" x2="310" y2="130" stroke="#c0392b" stroke-width="2.2"/>
  <!-- D2 = (BC) -->
  <line x1="177" y1="315" x2="365" y2="190" stroke="#1f5fa8" stroke-width="2.2"/>
  <!-- D3 = (DH) -->
  <line x1="155" y1="310" x2="155" y2="14" stroke="#2e7d32" stroke-width="2.2"/>
  <!-- sommets -->
  <g fill="#000000">
    <circle cx="80" cy="280" r="2.5"/><circle cx="230" cy="280" r="2.5"/>
    <circle cx="305" cy="230" r="2.5"/><circle cx="155" cy="230" r="2.5"/>
    <circle cx="80" cy="130" r="2.5"/><circle cx="230" cy="130" r="2.5"/>
    <circle cx="305" cy="80" r="2.5"/><circle cx="155" cy="80" r="2.5"/>
  </g>
  <g font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#000000">
    <text x="64" y="297">A</text>
    <text x="226" y="300">B</text>
    <text x="312" y="242">C</text>
    <text x="136" y="246">D</text>
    <text x="64" y="124">E</text>
    <text x="236" y="122">F</text>
    <text x="311" y="76">G</text>
    <text x="137" y="76">H</text>
  </g>
  <g font-family="Helvetica, Arial, sans-serif" font-size="16" font-style="italic">
    <text x="18" y="122" fill="#c0392b">D<tspan font-size="11" dy="4">1</tspan></text>
    <text x="356" y="182" fill="#1f5fa8">D<tspan font-size="11" dy="4">2</tspan></text>
    <text x="162" y="26" fill="#2e7d32">D<tspan font-size="11" dy="4">3</tspan></text>
  </g>
</svg>
