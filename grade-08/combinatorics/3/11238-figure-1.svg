<svg xmlns="http://www.w3.org/2000/svg" width="300" height="230" viewBox="0 0 300 230">
  <rect x="0" y="0" width="300" height="230" fill="#ffffff"/>
  <!-- blue dashed: AB, AC -->
  <line x1="160" y1="30" x2="250" y2="145" stroke="#1f5fd1" stroke-width="2.5" stroke-dasharray="8,6"/>
  <line x1="160" y1="30" x2="70" y2="195" stroke="#1f5fd1" stroke-width="2.5" stroke-dasharray="8,6"/>
  <!-- red solid: AD, DB, DC, CB -->
  <line x1="160" y1="30" x2="55" y2="95" stroke="#d62020" stroke-width="4"/>
  <line x1="55" y1="95" x2="250" y2="145" stroke="#d62020" stroke-width="4"/>
  <line x1="55" y1="95" x2="70" y2="195" stroke="#d62020" stroke-width="4"/>
  <line x1="70" y1="195" x2="250" y2="145" stroke="#d62020" stroke-width="4"/>
  <circle cx="160" cy="30" r="4" fill="#000"/>
  <circle cx="55" cy="95" r="4" fill="#000"/>
  <circle cx="250" cy="145" r="4" fill="#000"/>
  <circle cx="70" cy="195" r="4" fill="#000"/>
  <text x="160" y="20" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#000">A</text>
  <text x="38" y="95" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#000">D</text>
  <text x="268" y="150" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#000">B</text>
  <text x="58" y="215" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#000">C</text>
</svg>
