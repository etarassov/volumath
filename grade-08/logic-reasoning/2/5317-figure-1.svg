<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" width="280" height="280">
  <rect x="0" y="0" width="280" height="280" fill="#ffffff"/>

  <!-- thin cell borders -->
  <g stroke="#999999" stroke-width="1.2" fill="none">
    <line x1="80"  y1="20" x2="80"  y2="260"/>
    <line x1="140" y1="20" x2="140" y2="260"/>
    <line x1="200" y1="20" x2="200" y2="260"/>
    <line x1="20" y1="80"  x2="260" y2="80"/>
    <line x1="20" y1="140" x2="260" y2="140"/>
    <line x1="20" y1="200" x2="260" y2="200"/>
  </g>

  <!-- thick cage borders -->
  <g stroke="#000000" stroke-width="4.5" stroke-linecap="square" fill="none">
    <rect x="20" y="20" width="240" height="240"/>
    <line x1="80"  y1="20"  x2="80"  y2="80"/>
    <line x1="80"  y1="140" x2="80"  y2="260"/>
    <line x1="140" y1="20"  x2="140" y2="200"/>
    <line x1="200" y1="20"  x2="200" y2="260"/>
    <line x1="20"  y1="80"  x2="80"  y2="80"/>
    <line x1="20"  y1="140" x2="140" y2="140"/>
    <line x1="200" y1="140" x2="260" y2="140"/>
    <line x1="140" y1="200" x2="200" y2="200"/>
  </g>

  <!-- cage goals -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#000000">
    <text x="26" y="38">4</text>
    <text x="86" y="38">7+</text>
    <text x="146" y="38">8+</text>
    <text x="206" y="38">3&#8722;</text>
    <text x="26" y="158">3&#215;</text>
    <text x="86" y="158">7+</text>
    <text x="206" y="158">6&#215;</text>
  </g>
</svg>
