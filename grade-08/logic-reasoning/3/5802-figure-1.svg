<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 230" width="420" height="230">
  <rect x="0" y="0" width="420" height="230" fill="#ffffff"/>
  <!-- sand -->
  <rect x="0" y="168" width="420" height="52" fill="#e9dcbc" stroke="none"/>
  <line x1="0" y1="168" x2="420" y2="168" stroke="#000" stroke-width="1.5"/>

  <!-- wall -->
  <rect x="96" y="40" width="10" height="130" fill="#9a9a9a" stroke="#000" stroke-width="1.5"/>
  <text x="101" y="32" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#000">mur</text>

  <!-- person 1 : faces right (towards the wall) -->
  <ellipse cx="52" cy="132" rx="23" ry="26" fill="#f6f0e2" stroke="#000" stroke-width="1.5"/>
  <path d="M 29 118 A 23 23 0 0 1 75 118 L 78 118 L 26 118 Z" fill="#c9c9c9" stroke="#000" stroke-width="1.5"/>
  <text x="52" y="112" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#000">?</text>
  <circle cx="62" cy="130" r="2.5" fill="#000"/>
  <path d="M 70 132 l 9 4 l -9 4" fill="none" stroke="#000" stroke-width="1.5"/>
  <text x="52" y="196" font-family="Helvetica, Arial, sans-serif" font-size="16" text-anchor="middle" fill="#000">1</text>

  <!-- person 2 : faces left -->
  <ellipse cx="160" cy="132" rx="23" ry="26" fill="#f6f0e2" stroke="#000" stroke-width="1.5"/>
  <path d="M 137 118 A 23 23 0 0 1 183 118 L 186 118 L 134 118 Z" fill="#c9c9c9" stroke="#000" stroke-width="1.5"/>
  <text x="160" y="112" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#000">?</text>
  <circle cx="150" cy="130" r="2.5" fill="#000"/>
  <path d="M 142 132 l -9 4 l 9 4" fill="none" stroke="#000" stroke-width="1.5"/>
  <text x="160" y="196" font-family="Helvetica, Arial, sans-serif" font-size="16" text-anchor="middle" fill="#000">2</text>

  <!-- person 3 : faces left -->
  <ellipse cx="258" cy="132" rx="23" ry="26" fill="#f6f0e2" stroke="#000" stroke-width="1.5"/>
  <path d="M 235 118 A 23 23 0 0 1 281 118 L 284 118 L 232 118 Z" fill="#c9c9c9" stroke="#000" stroke-width="1.5"/>
  <text x="258" y="112" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#000">?</text>
  <circle cx="248" cy="130" r="2.5" fill="#000"/>
  <path d="M 240 132 l -9 4 l 9 4" fill="none" stroke="#000" stroke-width="1.5"/>
  <text x="258" y="196" font-family="Helvetica, Arial, sans-serif" font-size="16" text-anchor="middle" fill="#000">3</text>

  <!-- person 4 : faces left -->
  <ellipse cx="356" cy="132" rx="23" ry="26" fill="#f6f0e2" stroke="#000" stroke-width="1.5"/>
  <path d="M 333 118 A 23 23 0 0 1 379 118 L 382 118 L 330 118 Z" fill="#c9c9c9" stroke="#000" stroke-width="1.5"/>
  <text x="356" y="112" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#000">?</text>
  <circle cx="346" cy="130" r="2.5" fill="#000"/>
  <path d="M 338 132 l -9 4 l 9 4" fill="none" stroke="#000" stroke-width="1.5"/>
  <text x="356" y="196" font-family="Helvetica, Arial, sans-serif" font-size="16" text-anchor="middle" fill="#000">4</text>

  <!-- gaze arrows -->
  <path d="M 322 150 L 288 150" fill="none" stroke="#000" stroke-width="1.2" stroke-dasharray="4 3"/>
  <path d="M 322 158 L 190 158" fill="none" stroke="#000" stroke-width="1.2" stroke-dasharray="4 3"/>
  <path d="M 224 150 L 190 150" fill="none" stroke="#000" stroke-width="1.2" stroke-dasharray="4 3"/>
</svg>
